<!-- templates/garage/form_entree.html -->
{% extends 'base.html' %}

{% block content %}
<div class="container my-5" style="max-width: 800px;">
    <div class="card border-0 shadow-sm p-4 bg-white">
        <h3 class="fw-bold mb-4" style="color: #FF6600;"><i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Enregistrement Entrée Véhicule</h3>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_init %}
            {% csrf_token %}
            
            <div class="row g-3">
                {% for field in form %}
                    <div class="col-md-6 mb-2">
                        <label class="form-label fw-bold text-secondary small">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>
            
            <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
                <a href="{% url 'dashboard_mouvements' %}" class="btn btn-light text-muted fw-bold">Annuler</a>
                <button type="submit" class="btn px-4 fw-bold text-white" style="background-color: #FF6600;">Valider l'Entrée</button>
            </div>
        </form>
    </div>
</div>

<style>
    /* Focus stylisé aux couleurs Orange de votre charte */
    .form-control:focus {
        border-color: #FF6600 !important;
        box-shadow: 0 0 0 0.25rem rgba(255, 102, 0, 0.2) !important;
    }
</style>
{% endblock %}
