<!-- =========================================================================

========================================================================== -->
<style>
    .card:hover {

    /* Classe utilitaire pour animer l'apparition du texte */
    .fade-in-text {

    /* Empêche les sauts de ligne doublés induits par linebreaksbr dans des blocs compacts */

        content: "";
        margin: 2px 0;
        display: block;
    }
</style>
